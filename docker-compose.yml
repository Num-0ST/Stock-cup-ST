services:
  db:
    image: postgres:16
    restart: unless-stopped
    # memory settings for a database of a few GB (several years of data); safe on a machine with 4 GB+ RAM
    command: postgres -c shared_buffers=256MB -c effective_cache_size=1GB -c work_mem=16MB -c maintenance_work_mem=128MB
    environment:
      POSTGRES_DB: ${DB_NAME:-wms}
      POSTGRES_USER: ${DB_USER:-wms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wms} -d ${DB_NAME:-wms}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-wms}:${DB_PASSWORD}@db:5432/${DB_NAME:-wms}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      UPLOAD_DIR: /data/uploads
      BILL_OCR_ENGINE: ${BILL_OCR_ENGINE:-auto}
      BILL_OCR_LANGS: ${BILL_OCR_LANGS:-tha+eng}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BILL_AI_MODEL: ${BILL_AI_MODEL:-claude-sonnet-5-5}
    volumes:
      - uploads:/data/uploads
    ports:
      - "${API_PORT:-8000}:8000"

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-wms}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME:-wms}
      BACKUP_DIR: /backups
      UPLOAD_DIR: /data/uploads
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      IMPORT_ROWS_KEEP_DAYS: ${IMPORT_ROWS_KEEP_DAYS:-180}
      BACKUP_HOUR: ${BACKUP_HOUR:-02}
      TZ: ${TZ:-Asia/Bangkok}
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
      - uploads:/data/uploads:ro
    entrypoint: ["/bin/bash", "/scripts/backup-loop.sh"]

  # ---- public https link through Cloudflare (optional, choose ONE) ---------------------------------
  # Quick link, no account needed; the address changes every time the tunnel restarts:
  #   docker compose --profile quick-tunnel up -d     then: docker compose logs quick-tunnel  (look for trycloudflare.com)
  quick-tunnel:
    image: cloudflare/cloudflared:2026.11.1
    profiles: ["quick-tunnel"]
    restart: unless-stopped
    depends_on: [api]
    command: tunnel --no-autoupdate --url http://api:8000

  # Permanent address on your own domain: create a tunnel in the Cloudflare dashboard (Zero Trust -> Networks ->
  # Tunnels), point its public hostname to http://api:8000, put the token in .env as TUNNEL_TOKEN, then:
  #   docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:2026.11.1
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on: [api]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run

volumes:
  pgdata:
  uploads:
